<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blidux - Sign up</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .app-icon {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <img src="BliduxAppIcon.png" alt="Blidux Icon" class="app-icon">

    <div class="auth-container">
        <h1>
            Welcome to Blidux</h1>
        <p>Sign in to start creating and playing 25x25 mini-games!</p>
        <button id="googleAuthBtn" class="google-btn">Sign in with Google</button>
    </div>

    <script type="module" src="signup.js"></script>
</body>
</html>
